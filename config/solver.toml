# Solver configuration. Nothing here is compiled in: crates/postflop reads this file
# at run time (config.rs, from phase 1 onwards) and rejects a missing field, a
# non-finite value, a negative value, or a zero where zero has no meaning.

# Storage width for regrets and strategy sums: "f64", "f32", or "i16". Arithmetic
# inside a node update is f64 whichever is chosen; this sets the width the
# accumulators are kept at between iterations, which is what decides whether a flop
# tree fits in memory. Only "f64" is accepted today: "f32" arrives in step 7 of
# docs/phase-4/PLAN.md and "i16" in step 10, and asking for either now fails with a
# message naming that step. Omitting the key means "f64". It has to sit above
# [solve] because TOML gives a bare key to the table above it.
precision = "f64"

# Everything one solve may hold at once, in MiB: the game, its solver arrays,
# its retained averages and its query workspaces. 12288 MiB is 12 GiB, the
# default decision 4 of docs/phase-4/PLAN.md settled on, which leaves 4 GiB of a
# 16 GB machine for the desktop app and the operating system. The hard ceiling is
# 16384 MiB and a larger value is refused. A tree whose estimate exceeds this
# refuses to start rather than allocating part of itself: the flop gate tree at
# f64 needs about 84 GiB and says so. Omitting the key means 12288. Like
# precision, it has to sit above [solve] because TOML gives a bare key to the
# table above it.
memory_limit_mib = 12288

[solve]
# Stopping target for a solve, as a percentage of the fixed root pot. 0.5 means half
# of one percent, which is the roadmap's phase 3 gate. The metric behind it is
# 100 * (nash_conv / 2) / starting_pot; crates/postflop/README.md records the units
# and the conversion to a raw nash_conv target in chips.
target_pct_of_pot = 0.5

# Hard cap on iterations. A solve that stops here reports StopReason::IterationCap
# rather than claiming it reached the target.
max_iterations = 10000

# How often, in iterations, exploitability is measured against the target.
check_every = 100

# Progress interval checked between iterations, independently of check_every.
# A single slow iteration can exceed this interval; phase 1 is synchronous.
log_every_secs = 10

# Worker threads. 0 asks for one per available core, 1 asks for serial execution,
# and a larger number asks for a pool of that size. Every value is accepted, and
# 0 is resolved through the platform's reported parallelism once, so the memory
# estimate charges for exactly the workspaces the solver allocates. The traversal
# itself still runs serially on the first workspace until step 4 of
# docs/phase-4/PLAN.md wires the parallel walk over runouts.
threads = 0

[dcfr]
# Discounted CFR parameters from Brown and Sandholm 2019, the defaults recorded in
# docs/research/solver-algorithms.md: positive regrets scale by t^alpha/(t^alpha+1),
# negative regrets by t^beta/(t^beta+1), strategy sums by (t/(t+1))^gamma.
alpha = 1.5
beta = 0.0
gamma = 2.0
