# Phase 0 gate. Everything a reviewer would run locally, run on both platforms the
# project targets, on a clean checkout, without rewriting a lockfile.
#
# Policy, from Astra's finding P02 in
# docs/reviews/2026-09-05-astra-phase-0-1-plan-findings.md:
#   * `push` and `pull_request` only. No `pull_request_target`, no `workflow_run`, and
#     no step that executes pull-request code with a write token or downloads an
#     artifact built by one.
#   * `permissions: contents: read` at the top level, so every job inherits a
#     read-only token. No job widens it.
#   * No secret is read anywhere in this file.
#   * Every `uses:` is pinned to a full commit SHA, GitHub-owned actions included,
#     with the tag it resolved to in the comment beside it. The SHAs were read from
#     the GitHub API on 2026-09-05 (`/repos/{owner}/{repo}/git/ref/tags/{tag}`,
#     dereferenced through `/git/tags/{sha}` for the annotated ones) and each was
#     confirmed to be the commit that tag points at. Pinning fixes what runs; it is
#     not a statement that the action is safe.
#   * `actions/checkout` runs with `persist-credentials: false`, so no token is left
#     in `.git/config` for a later step to reuse.
#
# The Rust workspace excludes app/src-tauri, so the Linux runner never needs
# webkit2gtk. The desktop crate is formatted, linted, and built for real on Windows
# in the last three steps.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Rust formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Check Rust formatting
        id: formatting
        run: cargo fmt --all --check
      - name: Prepare the formatter patch on failure
        if: failure() && steps.formatting.outcome == 'failure'
        run: |
          cargo fmt --all
          mkdir -p target/format-evidence
          git diff --binary -- crates tests > target/format-evidence/rustfmt.patch
      - name: Save the formatter patch
        if: failure() && steps.formatting.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustfmt-patch
          path: target/format-evidence/rustfmt.patch
          if-no-files-found: error
          retention-days: 7

  check:
    name: Solver (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      # Before checkout, not after: the paths that overflow 260 characters are the
      # ones checkout itself writes. Global because there is no repository yet.
      - name: Allow long paths on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.longpaths true

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rust-toolchain.toml pins the exact compiler. `rustup show active-toolchain`
      # fails when it is not installed yet, and `rustup toolchain install` with no
      # argument then installs the one that file names.
      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show
          rustc --version
          cargo --version

      - name: Cache Cargo output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            app/src-tauri -> target
          key: ${{ matrix.os }}
          cache-on-failure: true

      - name: cargo clippy
        shell: bash
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        if: ${{ !cancelled() }}
        shell: bash
        env:
          ASTRA_CFR_TRACE_DIR: ${{ github.workspace }}/target/cfr-traces
        run: cargo test --workspace --locked --no-fail-fast -- --nocapture

      - name: Install Python for independent solver verification
        if: ${{ !cancelled() }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          architecture: x64
          cache: pip
          cache-dependency-path: tests/reference/openspiel/requirements.txt

      - name: Install the pinned reference dependency
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r tests/reference/openspiel/requirements.txt
          python -m pip check

      - name: Verify solver updates and actual policies independently
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python tests/reference/exact_mass_vectors.py --check
          python -m unittest discover -s tests/reference/openspiel -p 'test_*.py'
          python tests/reference/openspiel/verify_snapshots.py target/cfr-traces --output target/cfr-traces/verification.json

      - name: Save numerical comparison snapshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cfr-traces-${{ matrix.os }}
          path: target/cfr-traces/
          if-no-files-found: warn
          retention-days: 7

      - name: Capture measured river policies and convergence
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python tests/reference/river/prepare_project.py tests/reference/river/diagnostics.json target/river-project/diagnostic-inputs.toml
          python tests/reference/river/prepare_project.py tests/reference/river/cases.json target/river-project/case-inputs.toml
          cargo run --release --locked -p postflop --example river_capture -- target/river-project/diagnostic-inputs.toml target/river-project/diagnostics.toml
          cargo run --release --locked -p postflop --example river_capture -- target/river-project/case-inputs.toml target/river-project/cases.toml
          cargo run --release --locked -p postflop --example river_capture -- target/river-project/case-inputs.toml target/river-project/refined-cases.toml --finish-budget

      - name: Independently evaluate every captured river policy
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python -m unittest discover -s tests/reference/river -p 'test_*.py'
          python tests/reference/river/verify_project.py target/river-project/diagnostics.toml target/river-project/diagnostic-verification.json
          python tests/reference/river/verify_project.py target/river-project/cases.toml target/river-project/case-verification.json
          python tests/reference/river/verify_project.py target/river-project/refined-cases.toml target/river-project/refined-verification.json

      - name: Save measured river policies
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: river-project-${{ matrix.os }}
          path: target/river-project/
          if-no-files-found: warn
          retention-days: 7

  river-reference:
    name: Independent river WASM reference
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
      - name: Check reference protocol guards
        run: |
          python -m unittest discover -s tests/reference/river -p 'test_*.py'
          node --test tests/reference/river/capture.test.mjs
      - name: Capture independent reference diagnostics
        run: python tests/reference/river/capture.py --inputs tests/reference/river/diagnostics.json --temp-root "$RUNNER_TEMP" --output target/river-reference/diagnostics.json
      - name: Capture independent river reference cases
        run: python tests/reference/river/capture.py --inputs tests/reference/river/cases.json --temp-root "$RUNNER_TEMP" --output target/river-reference/cases.json
      - name: Capture the complete reference iteration budget
        run: python tests/reference/river/capture.py --inputs tests/reference/river/cases.json --temp-root "$RUNNER_TEMP" --output target/river-reference/refined-cases.json --finish-budget
      - name: Capture unrounded reference values at the same iteration budget
        run: python tests/reference/river/capture.py --inputs tests/reference/river/cases.json --temp-root "$RUNNER_TEMP" --output target/river-reference/raw-refined-cases.json --finish-budget --raw-display
      - name: Verify the presentation change preserved the solved policies
        env:
          RIVER_PRESENTATION_PAIR_DIR: target/river-reference
        run: |
          python tests/reference/river/verify_presentation.py --default target/river-reference/refined-cases.json --raw target/river-reference/raw-refined-cases.json > target/river-reference/presentation-verification.json
          python -m unittest discover -s tests/reference/river -p 'test_verify_presentation.py'
      - name: Save factual reference outputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: river-wasm-reference
          path: target/river-reference/*.json
          if-no-files-found: warn
          retention-days: 7

  # The turn reference. Same pinned wasm-postflop and postflop-solver revisions as
  # river-reference, and the same rule: the external checkout happens inside capture.py,
  # in the runner's temp directory, and no upstream source is ever committed here.
  #
  # The longer timeout is not caution. river-reference builds the toolchain four times for
  # four small river solves; this job builds it once, but the solve is a turn tree with
  # roughly 470 live combos a side and 48 runouts, which is minutes of single-threaded WASM
  # per case rather than seconds.
  turn-reference:
    name: Independent turn WASM reference
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
      - name: Check turn reference protocol guards
        run: |
          python -m unittest discover -s tests/reference/turn -p 'test_*.py'
          node --test tests/reference/turn/capture.test.mjs
          python tests/reference/turn/capture.py --validate-only --inputs tests/reference/turn/cases.json
      - name: Capture the independent turn reference cases
        run: python tests/reference/turn/capture.py --inputs tests/reference/turn/cases.json --temp-root "$RUNNER_TEMP" --output target/turn-reference/cases.json
      # Reference-only mode until crates/postflop/examples/turn_capture.rs exists (step 5b).
      # It still fails the job on a malformed capture, a wrong pinned revision, a missing
      # runout branch or an unreachable convergence claim.
      - name: Validate the reference capture and report its convergence
        run: python tests/reference/turn/compare.py --reference target/turn-reference/cases.json --output target/turn-reference/reference-summary.json
      - name: Save factual reference outputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: turn-wasm-reference
          path: target/turn-reference/*.json
          if-no-files-found: warn
          retention-days: 7

  # Step 5b lands crates/postflop/examples/turn_capture.rs. Until then this gate reports
  # absent and turn-solve is skipped rather than green, so nobody reads a job that ran
  # nothing as evidence that the turn solve passed.
  turn-solve-gate:
    name: Turn capture example present
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      present: ${{ steps.detect.outputs.present }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Look for the turn capture example
        id: detect
        shell: bash
        env:
          EXAMPLE_HASH: ${{ hashFiles('crates/postflop/examples/turn_capture.rs') }}
        run: |
          if [ -n "$EXAMPLE_HASH" ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
            echo "Found crates/postflop/examples/turn_capture.rs ($EXAMPLE_HASH)"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'crates/postflop/examples/turn_capture.rs does not exist yet; turn-solve is skipped'
          fi

  turn-solve:
    name: Turn solve (${{ matrix.os }})
    needs: turn-solve-gate
    if: needs.turn-solve-gate.outputs.present == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      # Before checkout, not after: the paths that overflow 260 characters are the
      # ones checkout itself writes. Global because there is no repository yet.
      - name: Allow long paths on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.longpaths true

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show
          rustc --version
          cargo --version

      - name: Cache Cargo output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            app/src-tauri -> target
          key: ${{ matrix.os }}
          cache-on-failure: true

      # Built first and then run as a plain binary, so the resident-set measurement covers
      # the solve and not cargo's own compilation.
      - name: Build the turn capture example
        shell: bash
        run: cargo build --release --locked -p postflop --example turn_capture

      - name: Solve and measure peak RSS (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p target/turn-project
          status=0
          /usr/bin/time -v ./target/release/examples/turn_capture \
            tests/reference/turn/cases.json target/turn-project/cases.toml \
            2> target/turn-project/linux-time.txt || status=$?
          cat target/turn-project/linux-time.txt
          grep -E 'Maximum resident set size' target/turn-project/linux-time.txt
          exit "$status"

      - name: Solve and measure peak RSS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/turn-project | Out-Null
          $exe = "target/release/examples/turn_capture.exe"
          $process = Start-Process -FilePath $exe -PassThru -NoNewWindow -ArgumentList @(
            "tests/reference/turn/cases.json",
            "target/turn-project/cases.toml"
          )
          $peak = 0
          while (-not $process.HasExited) {
            try { $peak = [Math]::Max($peak, (Get-Process -Id $process.Id).PeakWorkingSet64) } catch { }
            Start-Sleep -Milliseconds 500
          }
          $process.WaitForExit()
          try { $peak = [Math]::Max($peak, $process.PeakWorkingSet64) } catch { }
          "peak_working_set_bytes=$peak" | Out-File -Encoding utf8 target/turn-project/windows-peak-rss.txt
          Write-Output "Peak working set: $peak bytes"
          if ($process.ExitCode -ne 0) { throw "turn_capture exited with $($process.ExitCode)" }

      - name: Save the measured turn capture
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: turn-project-${{ matrix.os }}
          path: target/turn-project/
          if-no-files-found: warn
          retention-days: 7

  # The turn gate itself: our solve against the independent one, per OS. It needs both
  # captures, so it is a separate job rather than a step of either; `needs` also means a
  # skipped or failed turn-solve leaves this skipped rather than green, and compare.py
  # refuses a missing project capture by name if it ever runs without one.
  #
  # --expected-revision is what stops a stale artifact standing in for a fresh solve: the
  # capture has to name this workflow's own commit.
  turn-compare:
    name: Turn project versus reference
    needs: [turn-solve, turn-reference]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          architecture: x64

      - name: Download the independent reference capture
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: turn-wasm-reference
          path: target/turn-reference

      - name: Download the Linux turn capture
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: turn-project-ubuntu-latest
          path: target/turn-project-ubuntu-latest

      - name: Download the Windows turn capture
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: turn-project-windows-latest
          path: target/turn-project-windows-latest

      - name: Compare each measured capture against the reference
        shell: bash
        run: |
          mkdir -p target/turn-comparison
          review=tests/reference/turn/per-combo-review.json
          args=()
          if [ -f "$review" ]; then
            args+=(--review "$review")
            echo "Reviewing against $review"
          else
            echo "No committed per-combo review; any row over two points will fail the gate"
          fi
          status=0
          for os in ubuntu-latest windows-latest; do
            echo "::group::turn-compare $os"
            python tests/reference/turn/compare.py \
              --project "target/turn-project-$os/cases.toml" \
              --reference target/turn-reference/cases.json \
              --output "target/turn-comparison/$os.json" \
              --expected-revision "${{ github.sha }}" \
              "${args[@]}" || status=$?
            echo "::endgroup::"
          done
          exit "$status"

      - name: Save the comparison reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: turn-comparison
          path: target/turn-comparison/
          if-no-files-found: warn
          retention-days: 7

  # The 49-flop subset is seeded, so "reproducible" has to mean the same list on both
  # platforms, not the same list on whichever runner happened to write it. Its own job
  # because step 8 has not built the rest of tests/reference/flop yet.
  flop-subset:
    name: Flop subset (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Allow long paths on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.longpaths true
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Check the committed flop subset
        shell: bash
        run: |
          python -m unittest discover -s tests/reference/flop -p 'test_*.py'
          python tests/reference/flop/select_flops.py --check

  app:
    name: App (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      # Before checkout, not after: the paths that overflow 260 characters are the
      # ones checkout itself writes. Global because there is no repository yet.
      - name: Allow long paths on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.longpaths true

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rust-toolchain.toml pins the exact compiler. `rustup show active-toolchain`
      # fails when it is not installed yet, and `rustup toolchain install` with no
      # argument then installs the one that file names.
      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show
          rustc --version
          cargo --version

      - name: Cache Cargo output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            app/src-tauri -> target
          key: ${{ matrix.os }}
          cache-on-failure: true

      # Before setup-node, so setup-node's pnpm cache can find the pnpm binary.
      # No `version` input: pnpm/action-setup reads the exact version from the
      # `packageManager` field in the root package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: pnpm install
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: pnpm format:check
        shell: bash
        run: pnpm format:check

      - name: pnpm lint
        shell: bash
        run: pnpm lint

      - name: pnpm typecheck
        shell: bash
        run: pnpm typecheck

      - name: pnpm test
        shell: bash
        run: pnpm test

      - name: pnpm build
        shell: bash
        run: pnpm build

      # The desktop crate is outside the Cargo workspace, so the three commands
      # above never touched it. Windows is where the app actually ships, and
      # windows-latest already carries WebView2.
      - name: cargo fmt (app/src-tauri)
        if: runner.os == 'Windows'
        shell: bash
        working-directory: app/src-tauri
        run: cargo fmt --check

      - name: cargo clippy (app/src-tauri)
        if: runner.os == 'Windows'
        shell: bash
        working-directory: app/src-tauri
        run: cargo clippy --locked -- -D warnings

      # A real build, not `cargo check`: linking is where a Tauri crate fails.
      # --no-bundle skips the installer. Arguments after -- reach Cargo, so the
      # release build also fails if its committed dependency resolution is stale.
      - name: tauri build
        if: runner.os == 'Windows'
        shell: bash
        run: pnpm tauri build --no-bundle -- --locked

      - name: Prepare native WebView2 test drivers
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./app/scripts/setup-webdriver.ps1

      - name: Test the native release security boundary
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        run: ./app/scripts/run-native-smoke.ps1

      - name: Save native runtime evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-runtime-windows
          path: app/test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Check committed lockfiles stayed unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock app/src-tauri/Cargo.lock pnpm-lock.yaml
