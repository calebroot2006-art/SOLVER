# This crate is excluded from the root Cargo workspace (see the root Cargo.toml) so a
# Linux CI runner never has to install webkit2gtk. It keeps its own Cargo.lock, which
# is committed, and is built natively on Windows in .github/workflows/ci.yml.
#
# Versions are exact on purpose. tauri-plugin-opener, which the generator adds by
# default, was removed along with the demo `greet` command: see app/README.md.
[package]
name = "app"
version = "0.1.0"
description = "GTO Solver APP desktop shell"
edition = "2021"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
publish = false

[lib]
# The `_lib` suffix keeps the library name from colliding with the binary name on
# Windows: https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
